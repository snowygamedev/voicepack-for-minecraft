name: CI

on:
  push:
    branches: [main]
  pull_request:

# This repository is public, so pull requests from forks run this workflow.
# Nothing here needs write access or secrets; state that outright rather than
# inheriting whatever the repository default happens to be.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

      # Packaging is where config mistakes surface (missing icon, bad asarUnpack),
      # and they're invisible to lint and tests. --dir skips the installer and
      # signing, so it stays fast enough for every push.
      - name: Smoke-test packaging
        run: npm run pack:dir
